name: Docker Build

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  docker-build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devops-portfolio:${{ github.sha }} .

      - name: Verify Docker image
        run: docker images
